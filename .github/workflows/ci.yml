# Build + typecheck + SBOM. Least-privilege by default (docs/SECURITY.md §7).
# Every `uses:` is pinned to a full commit SHA (SLSA / OpenSSF Scorecard); the
# trailing comment records the human-readable version it corresponds to.
name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run audit:ci
      - run: npm run build
      - name: Start LocalStack integration services
        run: docker compose -f docker-compose.localstack.yml up -d --wait
      - run: npm test --if-present
      - run: npm run test:web --if-present
      - name: Stop LocalStack integration services
        if: always()
        run: docker compose -f docker-compose.localstack.yml down
      # A real `cdk synth`, not just the assertion tests (#202).
      #
      # `npm test` builds templates via `Template.fromStack`, which covers the
      # STACK. It does not cover `bin/addressium.ts` — config loading, stage
      # validation, the app wiring — and it does not run the bundler. Every
      # infrastructure defect this repo has shipped was synth-visible, so the
      # cheapest possible gate is to actually synthesize.
      - name: cdk synth
        run: |
          cp infra/cdk/addressium.config.example.json infra/cdk/addressium.config.json
          npm run --workspace infra/cdk synth -- --quiet

  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      # CycloneDX SBOM published as a build artifact (docs/SECURITY.md §7).
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  # Deploys use OIDC to assume a scoped AWS role — NO long-lived access keys.
  # Runs only on tagged releases. Set the DEPLOY_ROLE_ARN repo variable to the
  # pre-created addressium-deploy role, then the credential + deploy steps run.
  deploy:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC — mint a short-lived token to assume the AWS role
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
      - name: Write and validate deployment configuration
        id: deployment-config
        if: vars.DEPLOY_ROLE_ARN != ''
        env:
          ADDRESSIUM_CONFIG_JSON: ${{ secrets.ADDRESSIUM_CONFIG_JSON }}
        run: |
          test -n "$ADDRESSIUM_CONFIG_JSON" || (echo "Set the ADDRESSIUM_CONFIG_JSON repository secret before deploying." && exit 1)
          printf '%s' "$ADDRESSIUM_CONFIG_JSON" > infra/cdk/addressium.config.json
          node <<'NODE'
          const fs = require("node:fs");
          const config = require("./infra/cdk/addressium.config.json");
          const stage = config.stage ?? "dev";
          const region = config.region ?? "us-east-1";
          if (!["dev", "staging", "prod"].includes(stage)) throw new Error(`invalid deployment stage: ${stage}`);
          if (!/^[a-z0-9-]+$/.test(region)) throw new Error(`invalid AWS region: ${region}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stage=${stage}\nregion=${region}\n`);
          NODE
      - name: Configure AWS credentials via OIDC
        if: vars.DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.deployment-config.outputs.region }}
      - run: npm ci
      - run: npm run build
      - name: Check the CloudFormation change set for destructive replacements
        if: vars.DEPLOY_ROLE_ARN != ''
        env:
          STAGE: ${{ steps.deployment-config.outputs.stage }}
          AWS_REGION: ${{ steps.deployment-config.outputs.region }}
        run: ./scripts/deploy-check.sh --stage "$STAGE" --region "$AWS_REGION"
      - name: Deploy the control-plane stack
        if: vars.DEPLOY_ROLE_ARN != ''
        run: npx cdk deploy --require-approval never
        working-directory: infra/cdk
      - name: Publish the operator and subscriber SPAs
        if: vars.DEPLOY_ROLE_ARN != ''
        env:
          ADDRESSIUM_PUBLIC_ORG_ID: ${{ vars.ADDRESSIUM_PUBLIC_ORG_ID }}
        run: npm run deploy:spas

  # A published GitHub release is the notification channel for self-hosted
  # operators: watchers receive GitHub's release notification, and the notes
  # describe the exact tagged upgrade rather than an unversioned branch push.
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish GitHub release and notify watchers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
